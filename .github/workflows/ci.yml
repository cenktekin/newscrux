name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --include=dev: devDependencies must be installed even if NODE_ENV=production leaks in.
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
